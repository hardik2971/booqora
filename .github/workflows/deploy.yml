name: Build & deploy Booqora

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: booqora_platform

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (fails on errors and warnings)
        run: flutter analyze --no-fatal-infos

      - name: Build web (release)
        run: flutter build web --release

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: booqora_platform/build/web
          retention-days: 7

  # Push to main → deploy to the live site + security rules.
  deploy-live:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://booqora-platform.web.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: booqora_platform/build/web
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy hosting + Firestore/Storage rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT repository secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          # Validate the secret without printing it.
          node -e '
            const fs = require("fs");
            let j;
            try { j = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); }
            catch (e) { console.log("::error::FIREBASE_SERVICE_ACCOUNT is not valid JSON (" + e.message + "). Paste the ENTIRE key file, from { to }."); process.exit(1); }
            const miss = ["type","project_id","private_key","client_email"].filter(k => !j[k]);
            if (miss.length) { console.log("::error::Secret JSON is missing: " + miss.join(", ")); process.exit(1); }
            if (!j.private_key.includes("BEGIN PRIVATE KEY")) { console.log("::error::private_key in the secret looks damaged."); process.exit(1); }
            console.log("::notice::Using service account " + j.client_email + " for project " + j.project_id);
          ' "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set +e
          npx --yes firebase-tools@15 deploy \
            --only "hosting:platform,firestore:rules,storage" \
            --project booqora-infidec --non-interactive \
            --message "GitHub ${GITHUB_SHA::7}" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          status=${PIPESTATUS[0]}
          rm -f "$RUNNER_TEMP/sa.json"
          if [ "$status" -ne 0 ]; then
            # Surface the real error as annotations (visible on the run summary).
            grep -iE "error|denied|permission|not found|invalid|failed" "$RUNNER_TEMP/deploy.log" | tail -8 | while IFS= read -r line; do
              echo "::error::${line:0:400}"
            done
            exit "$status"
          fi

  # Pull request → temporary preview URL (expires in 7 days), commented on the PR.
  deploy-preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: booqora_platform/build/web
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: booqora-infidec
          target: platform
          entryPoint: booqora_platform
          expires: 7d
