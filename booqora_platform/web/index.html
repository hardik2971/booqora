<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Booqora — Rental management platform</title>
  <meta name="description" content="Booqora is the all-in-one rental management platform: bookings, live availability, inventory, customers, documents, payments and an online store.">
  <meta name="theme-color" content="#6431DD">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Booqora — Rental management platform">
  <meta property="og:description" content="Bookings, inventory, customers, payments and your online store — one beautifully connected platform.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary">

  <!-- iOS / PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Booqora">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <!-- Warm up connections used at startup -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

  <style>
    html, body { margin: 0; height: 100%; background: #F7F5FC; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      background: linear-gradient(135deg, #1C0938 0%, #2B1270 55%, #351DB1 100%);
      transition: opacity .45s ease; z-index: 9999;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash img { width: 88px; height: 88px; animation: pulse 1.6s ease-in-out infinite; filter: drop-shadow(0 12px 30px rgba(100,49,221,.55)); }
    #splash .name { color: #fff; font: 800 26px/1 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -.5px; }
    #splash .bar { width: 150px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
    #splash .bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 4px; background: #C2A3F9; animation: load 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scale(.94); } 50% { transform: scale(1.04); } }
    @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
  </style>
</head>
<body>
  <div id="splash" aria-label="Loading Booqora">
    <img src="icons/Icon-192.png" alt="Booqora">
    <div class="name">Booqora</div>
    <div class="bar"></div>
  </div>
  <noscript>Booqora requires JavaScript to run.</noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.classList.add('hide'); setTimeout(function () { s.remove(); }, 500); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
